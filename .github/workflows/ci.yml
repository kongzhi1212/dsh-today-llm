name: ci

# Runs the checks on every push and pull request.
#
# Separate from `release` on purpose: releases fire on a tag and are allowed to
# be slow, while this one exists so the badge on the README reflects the current
# branch rather than the last thing that happened to be tagged.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check every file
        run: npm run check

      - name: Run the test suite
        run: npm test
