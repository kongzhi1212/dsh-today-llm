<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Today models appear in the DSH model selector with their usage multiplier">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2333"/>
      <stop offset="1" stop-color="#141a26"/>
    </linearGradient>
    <linearGradient id="sunDisc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e4552b"/>
    </linearGradient>
    <mask id="sunCut">
      <rect x="0" y="0" width="120" height="120" fill="#000"/>
      <circle cx="60" cy="64" r="27" fill="#fff"/>
      <rect x="31" y="67" width="58" height="6" fill="#000"/>
    </mask>
    <clipPath id="cardClip">
      <rect x="140" y="40" width="464" height="220" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="640" height="300" fill="url(#cardBg)"/>

  <!-- Left: the account/sunrise mark -->
  <g transform="translate(48 66)">
    <circle cx="60" cy="64" r="27" fill="url(#sunDisc)" mask="url(#sunCut)"/>
    <rect x="32" y="67" width="56" height="6" rx="3" fill="url(#sunDisc)"/>
    <g stroke="url(#sunDisc)" stroke-width="5" stroke-linecap="round">
      <path d="M60 14v11"/>
      <path d="M35 24l8 8"/>
      <path d="M85 24l-8 8"/>
    </g>
    <path d="M30 108c8 9 19 13 30 13s22-4 30-13"
          fill="none" stroke="#5b86f0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Right: the selector rows -->
  <g clip-path="url(#cardClip)">
    <rect x="140" y="40" width="464" height="220" rx="14" fill="#202a3c"/>
    <rect x="140" y="40" width="464" height="52" rx="14" fill="#27324a"/>

    <!-- Row 1 (selected) -->
    <rect x="156" y="58" width="432" height="34" rx="8" fill="#31405d"/>
    <circle cx="178" cy="75" r="7" fill="url(#sunDisc)"/>
    <rect x="196" y="68" width="104" height="6" rx="3" fill="#dfe6f2"/>
    <rect x="196" y="80" width="62" height="5" rx="2.5" fill="#8d9bb2"/>
    <rect x="470" y="67" width="48" height="17" rx="8.5" fill="#2f6a4a"/>
    <rect x="480" y="73" width="28" height="5" rx="2.5" fill="#7fe0a8"/>

    <!-- Row 2 -->
    <circle cx="178" cy="119" r="7" fill="url(#sunDisc)"/>
    <rect x="196" y="112" width="132" height="6" rx="3" fill="#c6d0e0"/>
    <rect x="196" y="124" width="78" height="5" rx="2.5" fill="#77869c"/>
    <rect x="470" y="111" width="48" height="17" rx="8.5" fill="#3a4763"/>
    <rect x="480" y="117" width="28" height="5" rx="2.5" fill="#9fb0c9"/>

    <!-- Row 3 -->
    <circle cx="178" cy="163" r="7" fill="url(#sunDisc)"/>
    <rect x="196" y="156" width="88" height="6" rx="3" fill="#c6d0e0"/>
    <rect x="196" y="168" width="66" height="5" rx="2.5" fill="#77869c"/>
    <rect x="470" y="155" width="48" height="17" rx="8.5" fill="#3a4763"/>
    <rect x="480" y="161" width="28" height="5" rx="2.5" fill="#9fb0c9"/>

    <!-- Row 4 -->
    <circle cx="178" cy="207" r="7" fill="url(#sunDisc)"/>
    <rect x="196" y="200" width="118" height="6" rx="3" fill="#c6d0e0"/>
    <rect x="196" y="212" width="54" height="5" rx="2.5" fill="#77869c"/>
    <rect x="470" y="199" width="48" height="17" rx="8.5" fill="#3a4763"/>
    <rect x="480" y="205" width="28" height="5" rx="2.5" fill="#9fb0c9"/>
  </g>

  <!-- Connector from the mark to the list -->
  <path d="M186 126h-32" fill="none" stroke="#5b86f0" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
</svg>
