<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img" aria-label="Today models">
  <defs>
    <linearGradient id="todaySun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e4552b"/>
    </linearGradient>
    <mask id="todayCut">
      <rect width="36" height="36" fill="#000"/>
      <circle cx="18" cy="19.5" r="8.4" fill="#fff"/>
      <rect x="9.4" y="20.6" width="17.2" height="1.8" fill="#000"/>
    </mask>
  </defs>

  <!-- Sunrise over a horizon: the "today" the account belongs to. -->
  <circle cx="18" cy="19.5" r="8.4" fill="url(#todaySun)" mask="url(#todayCut)"/>
  <rect x="4.6" y="20.6" width="26.8" height="1.8" rx="0.9" fill="url(#todaySun)"/>

  <!-- Three rays above the disc. -->
  <g stroke="url(#todaySun)" stroke-width="1.8" stroke-linecap="round">
    <path d="M18 5.2v3.4"/>
    <path d="M10.1 8.1l2.4 2.4"/>
    <path d="M25.9 8.1l-2.4 2.4"/>
  </g>

  <!-- Connection arc: the account feeding a second application. -->
  <path d="M8.6 28.4c3.1 3 6.2 4.4 9.4 4.4s6.3-1.4 9.4-4.4"
        fill="none" stroke="#3f6ce0" stroke-width="1.8" stroke-linecap="round"/>
</svg>
